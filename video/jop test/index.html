<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Job Portal</h1>
            <nav id="main-nav">
                <ul>
                    <li><a href="#" id="homeLink">Home</a></li>
                    <li><a href="#" id="jobListingsLink">Job Listings</a></li>
                    <li><a href="#" id="loginLink">Login</a></li>
                </ul>
            </nav>
        </header>

        <div class="container">
            <aside id="sidebar" class="hidden">
                <nav>
                    <ul>
                        <li><button id="postJobBtn"><i class="fas fa-plus-circle"></i> Post New Job</button></li>
                        <li><button id="viewApplicationsBtn"><i class="fas fa-list-alt"></i> View Applications</button></li>
                        <li><button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button></li>
                    </ul>
                </nav>
            </aside>

            <main id="mainContent">
                <!-- Content will be dynamically inserted here -->
            </main>
        </div>

        <footer>
            <p>&copy; 2023 Job Portal. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="test.js"></script>
</body>
</html>
